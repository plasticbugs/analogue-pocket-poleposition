################################################################################
# Compile the Pole Position Pocket core and upload the SD-card package.
# Runs on every push to main, on tags, and on manual dispatch.
################################################################################
name: Compile Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint the RTL
        run: ./sim/lint.sh

  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space (Quartus image needs ~18GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/graalvm
          sudo docker image prune --all --force
          df -h /

      - name: Compile with Quartus 18.1 (Docker)
        run: |
          docker run --rm -v "$PWD":/build -w /build \
            raetro/quartus:pocket \
            quartus_sh --flow compile projects/pp_pocket.qpf

      - name: Package for Pocket
        run: python3 package-pocket.py

      - name: Show resource summary
        run: cat projects/output_files/pp_pocket.fit.summary || true

      - name: Check logic and block RAM fit
        run: |
          fit=projects/output_files/pp_pocket.fit.summary
          echo "--- resource use ---"
          grep -E 'Logic utilization|block memory|RAM Blocks|registers' "$fit" || true
          # Everything, ROMs included, lives in block RAM and the logic is
          # past 95%. A build that fits is still good, so this only warns --
          # the fitter itself fails the run if a change stops fitting.
          if grep -qiE '(Logic utilization|block memory bits).*\( *(9[6-9]|100) *%' "$fit"; then
            echo "::warning title=Device nearly full::$(grep -iE 'Logic utilization|block memory bits' "$fit" | tr '\n' ' ')"
          fi

      - name: Check timing closed
        run: |
          sta=projects/output_files/pp_pocket.sta.summary
          echo "--- worst slack per corner ---"
          grep -B3 'Slack' "$sta" | grep -E 'Type|Slack' | paste - - | head -20
          if grep -q 'Slack : -' "$sta"; then
            echo
            echo "TIMING NOT CLOSED -- refusing to call this build good."
            grep -B3 'Slack : -' "$sta" | head -30
            echo
            echo "--- worst paths ---"
            docker run --rm -v "$PWD":/build -w /build raetro/quartus:pocket \
              quartus_sta -t projects/report_worst.tcl >/dev/null 2>&1 || true
            grep -E '^; (From|To) Node|^; Slack ' \
              projects/output_files/worst_paths.txt 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "all corners positive"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: poleposition-pocket
          path: release/pocket/
          if-no-files-found: error

      - name: Publish release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Releases are normally cut from a hardware-verified CI run rather
          # than from a fresh compile, so the release usually exists already.
          # Keep that artifact; only publish here if the tag arrived without one.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already published; skipping"
            exit 0
          fi
          cd release/pocket && zip -qr ../../poleposition-pocket-sdcard.zip . && cd ../..
          gh release create "${GITHUB_REF_NAME}" \
            --title "Pole Position for Analogue Pocket ${GITHUB_REF_NAME}" \
            --notes "Unzip onto the Pocket SD card root, overwriting previous files. The ROM image goes in Assets/poleposition/common/." \
            poleposition-pocket-sdcard.zip

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            projects/output_files/*.rpt
            projects/output_files/*.summary
            projects/output_files/worst_paths.txt
          if-no-files-found: ignore
